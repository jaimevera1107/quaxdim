name: Bug report
description: Report a reproducible QuaxDim issue without private data
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducible example (synthetic data only)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: QuaxDim / Python / backend versions
    validations:
      required: true
