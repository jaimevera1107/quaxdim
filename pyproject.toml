[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quaxdim"
dynamic = ["version"]
description = "Scalable, explainable and auditable multidimensional data-quality checks"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "jaimevera1107"}]
keywords = ["data quality", "data validation", "profiling", "data contracts", "spark", "duckdb", "polars"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18"]

[project.urls]
Homepage = "https://github.com/jaimevera1107/quaxdim"
Source = "https://github.com/jaimevera1107/quaxdim"
Issues = "https://github.com/jaimevera1107/quaxdim/issues"
Documentation = "https://github.com/jaimevera1107/quaxdim/tree/main/docs"
Changelog = "https://github.com/jaimevera1107/quaxdim/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pandas = ["pandas>=2.0", "numpy>=1.24"]
duckdb = ["duckdb>=1.1"]
polars = ["polars>=1.0"]
spark = ["pyspark>=3.5,<5"]
parquet = ["pyarrow>=13"]
excel = ["openpyxl>=3.1"]
regex = ["regex>=2024.0.0"]
scale = ["duckdb>=1.1", "polars>=1.0", "pyarrow>=13"]
test = ["pytest>=8.0", "pandas>=2.0", "numpy>=1.24", "regex>=2024.0.0"]
dev = ["pytest>=8.0", "pandas>=2.0", "numpy>=1.24", "build>=1.2", "twine>=5.0"]

[project.scripts]
quaxdim = "quaxdim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["quaxdim*"]

[tool.setuptools.package-data]
quaxdim = ["schemas/*.json", "py.typed"]

[tool.setuptools.dynamic]
version = {attr = "quaxdim._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests", "tests_validation", "tests_public"]
addopts = "-ra"

[tool.coverage.run]
source = ["quaxdim"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
# PEP 8 maximum line length for code.
line-length = 79
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# PySpark's universal aliases (F = functions, T = types, DataFrame class
# resolved lazily) are kept as they are; renaming them hurts readability.
"src/quaxdim/spark_backend.py" = ["N803", "N806", "N812"]
"src/quaxdim/optimized.py" = ["N803", "N806", "N812"]
"src/quaxdim/advanced_discovery.py" = ["N803", "N806", "N812"]
"src/quaxdim/discovery.py" = ["N812"]
"src/quaxdim/runtime.py" = ["N806"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
